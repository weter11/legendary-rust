name: Rust Debian Package

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev libegl1-mesa-dev

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-deb
      run: cargo install cargo-deb

    - name: Build release
      run: cd legendary-rust && cargo build --release

    - name: Create Debian package
      run: cd legendary-rust && cargo deb

    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: legendary-rust-deb
        path: legendary-rust/target/debian/*.deb
